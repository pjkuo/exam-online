        { text: "以下哪種感測器用於測量土壤電導度？", options: ["EC 感測器", "pH 感測器", "溫度感測器", "濕度感測器"], correct: 0 },
        { text: "智慧家居中，語音助理屬於哪一層？", options: ["感知層", "網路層", "應用層", "控制層"], correct: 2 },
        { text: "以下何者是物聯網標準化組織？", options: ["IEEE", "IETF", "ITU", "以上皆是"], correct: 3 },
        { text: "物聯網的「大規模連接」特性主要由哪種技術支持？", options: ["Wi-Fi", "5G mMTC", "藍牙", "Zigbee"], correct: 1 },
        { text: "以下哪種是物聯網的商業模式？", options: ["設備銷售", "數據服務", "平台訂閱", "以上皆是"], correct: 3 },
        { text: "智慧工廠中，預測性維護屬於哪一層？", options: ["感知", "監控", "自動", "智慧"], correct: 3 },
        { text: "以下何者是物聯網設備的能耗管理目標？", options: ["延長電池壽命", "降低運算負載", "減少通訊次數", "以上皆是"], correct: 3 },
        { text: "物聯網的「感知層」不包括？", options: ["感測器", "攝影機", "雲端平台", "RFID 標籤"], correct: 2 },
        { text: "以下哪種技術用於物聯網設備的低功耗廣域通訊？", options: ["NB-IoT", "LoRa", "Sigfox", "以上皆是"], correct: 3 },
        { text: "智慧城市的「智慧」應用不包含？", options: ["交通優化", "能源管理", "傳統路燈", "垃圾清運優化"], correct: 2 },
        { text: "以下哪種是物聯網在環境監測的應用？", options: ["空氣品質監測", "水質監測", "噪音監測", "以上皆是"], correct: 3 }
    ];
    // 補足到 150 題（複製最後一題循環至滿150）
    while (CHOICE_QUESTION_POOL.length < 150) {
        CHOICE_QUESTION_POOL.push(CHOICE_QUESTION_POOL[CHOICE_QUESTION_POOL.length-1]);
    }

    // ==================== 完整 30 題簡答題庫 ====================
    const ESSAY_QUESTION_POOL = [
        { text: "請說明「物聯網四大功能（感知、監控、自動、智慧）」之差異，並舉一個實際案例說明其運作流程。", keywords: ["感知", "監控", "自動", "智慧", "案例"] },
        { text: "請以「智慧農業或養殖系統」為例，設計一個簡單的人機協作架構，說明：人的角色、邊緣設備功能、雲端AI功能。", keywords: ["人", "邊緣", "雲端", "AI", "控制"] },
        { text: "若沒有導入物聯網與AI系統，傳統管理可能面臨哪些問題？請從效率、準確性與風險三方面說明。", keywords: ["效率", "準確", "風險", "即時", "數據"] },
        { text: "請說明邊緣運算與雲端運算的差異，並舉例說明何時該用邊緣運算。", keywords: ["邊緣", "雲端", "延遲", "即時", "頻寬"] },
        { text: "請說明5G技術對物聯網應用的三大助力（eMBB、uRLLC、mMTC）及其應用場景。", keywords: ["5G", "eMBB", "uRLLC", "mMTC", "低延遲"] },
        { text: "請說明物聯網在智慧城市中的三個具體應用，並分別說明它們如何提升市民生活品質。", keywords: ["智慧城市", "交通", "能源", "安全", "效率"] },
        { text: "請說明「人機協作」與「自動化」的主要差異，並說明為何在極端氣候下人機協作更顯重要。", keywords: ["人機協作", "自動化", "極端氣候", "決策", "適應"] },
        { text: "請說明物聯網設備的「低功耗」設計如何影響其應用範圍？請舉例說明。", keywords: ["低功耗", "電池", "感測器", "廣域", "NB-IoT"] },
        { text: "請說明物聯網系統中「數據隱私與安全」可能面臨哪些威脅？並提出三項基本防護措施。", keywords: ["隱私", "安全", "加密", "認證", "防火牆"] },
        { text: "請說明「智慧農業」如何利用物聯網與AI達到節水與增產的目標。", keywords: ["智慧農業", "節水", "增產", "感測器", "AI"] },
        { text: "請說明物聯網在智慧醫療領域的應用，並舉出至少兩個具體案例。", keywords: ["智慧醫療", "遠距", "穿戴裝置", "監測", "AI"] },
        { text: "請說明物聯網的「感知層」與「應用層」在智慧家庭中的協作方式。", keywords: ["感知層", "應用層", "智慧家庭", "感測器", "控制"] },
        { text: "請說明「數位孿生」技術在智慧製造中的作用。", keywords: ["數位孿生", "虛擬", "模擬", "預測", "優化"] },
        { text: "請說明物聯網平台應具備哪些核心功能，並說明其重要性。", keywords: ["平台", "設備管理", "數據分析", "可視化", "整合"] },
        { text: "請說明物聯網系統中「邊緣運算」如何減少雲端負載與降低延遲。", keywords: ["邊緣運算", "雲端", "延遲", "頻寬", "即時"] },
        { text: "請說明物聯網在「智慧電網」中的應用，並說明其對能源管理的貢獻。", keywords: ["智慧電網", "能源管理", "監控", "負載", "再生能源"] },
        { text: "請說明物聯網設備的「OTA 更新」是什麼，並說明其重要性。", keywords: ["OTA", "更新", "韌體", "安全性", "遠端"] },
        { text: "請說明物聯網在「智慧物流」中如何提升貨物追蹤與冷鏈管理效率。", keywords: ["智慧物流", "追蹤", "冷鏈", "RFID", "溫度"] },
        { text: "請說明「機器學習」在物聯網數據分析中的角色，並舉例說明。", keywords: ["機器學習", "預測", "異常", "分類", "AI"] },
        { text: "請說明物聯網在「環境監測」中的應用，並舉例說明其對永續發展的貢獻。", keywords: ["環境監測", "空氣", "水質", "永續", "SDGs"] },
        { text: "請說明「低功耗廣域網路」技術（如 LoRa、NB-IoT）的應用場景與優勢。", keywords: ["LPWAN", "LoRa", "NB-IoT", "低功耗", "廣域"] },
        { text: "請說明物聯網系統中的「故障預測與健康管理」如何提升設備可靠性。", keywords: ["故障預測", "健康管理", "可靠性", "維護", "AI"] },
        { text: "請說明「智慧路燈」如何結合物聯網與 AI 達成節能與城市安全。", keywords: ["智慧路燈", "節能", "安全", "感測", "AI"] },
        { text: "請說明物聯網在「智慧停車」系統中的運作流程與效益。", keywords: ["智慧停車", "感測", "導引", "收費", "效率"] },
        { text: "請說明物聯網的「標準化」為何重要，並舉出一個標準組織或協定。", keywords: ["標準化", "互通", "IEEE", "MQTT", "規範"] },
        { text: "請說明物聯網在「智慧養殖」中的應用，並說明如何透過數據分析提升產量。", keywords: ["智慧養殖", "水質", "溶氧", "AI", "產量"] },
        { text: "請說明「人機協作」在農業自動化中的具體體現，並說明其優點。", keywords: ["人機協作", "農業", "自動化", "效率", "決策"] },
        { text: "請說明物聯網系統中「數據可視化」的重要性，並舉例說明。", keywords: ["數據可視化", "儀表板", "理解", "決策", "趨勢"] },
        { text: "請說明物聯網在「智慧校園」中的可能應用，並說明其對教學或管理的幫助。", keywords: ["智慧校園", "節能", "安全", "教學", "管理"] },
        { text: "請說明物聯網的未來發展趨勢，並說明你認為最具潛力的三個應用方向。", keywords: ["未來", "趨勢", "AIoT", "6G", "永續"] }
    ];

    const CHOICE_COUNT = 30;
    const ESSAY_COUNT = 3;

    let currentChoice = [];
    let currentEssay = [];
    let userChoice = [];
    let userEssay = [];
    let timerInterval = null;
    let timeSeconds = 60 * 60;

    // ---------- 輔助函數 ----------
    function getRandomItems(arr, n) {
        const shuffled = [...arr];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled.slice(0, n);
    }

    function scoreByKeywords(text, keywords, maxScore = 10) {
        if (!text || text.trim() === "") return 0;
        const lower = text.toLowerCase();
        let hit = 0;
        keywords.forEach(kw => { if (lower.includes(kw.toLowerCase())) hit++; });
        return Math.min(maxScore, Math.round((hit / keywords.length) * maxScore));
    }

    // ---------- 本機儲存 ----------
    function saveRecord(record) {
        let records = JSON.parse(localStorage.getItem('examScores') || '[]');
        records.unshift(record);
        if (records.length > 100) records = records.slice(0, 100);
        localStorage.setItem('examScores', JSON.stringify(records));
        renderHistory();
    }

    function getRecords() {
        return JSON.parse(localStorage.getItem('examScores') || '[]');
    }

    function clearHistory() {
        if (confirm("清除所有歷史成績記錄？")) {
            localStorage.removeItem('examScores');
            renderHistory();
        }
    }

    // ---------- 成績摘要渲染 ----------
    function renderHistory() {
        const records = getRecords();
        const tbody = document.getElementById('historyBody');
        if (records.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8">尚無任何成績記錄</td></tr>';
            document.getElementById('historyStats').innerHTML = '';
            return;
        }
        let html = '';
        records.forEach(r => {
            html += `<tr>
                        <td>${r.timestamp}</td>
                        <td>${r.name}</td>
                        <td>${r.studentId}</td>
                        <td>${r.className || ''}</td>
                        <td>${r.choiceScore}</td>
                        <td>${r.essayScore}</td>
                        <td>${r.total}</td>
                        <td>${r.grade}</td>
                     </tr>`;
        });
        tbody.innerHTML = html;
        const totals = records.map(r => r.total);
        const avg = (totals.reduce((a,b)=>a+b,0)/totals.length).toFixed(1);
        const maxScore = Math.max(...totals);
        const minScore = Math.min(...totals);
        const pass = totals.filter(s => s >= 60).length;
        const passRate = ((pass/totals.length)*100).toFixed(1);
        document.getElementById('historyStats').innerHTML = `
            <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 15px;">
                <div><strong>總考試次數：</strong> ${records.length}</div>
                <div><strong>平均分數：</strong> ${avg}</div>
                <div><strong>最高分：</strong> ${maxScore}</div>
                <div><strong>最低分：</strong> ${minScore}</div>
                <div><strong>及格率：</strong> ${passRate}%</div>
            </div>
        `;
    }

    function exportAllToExcel() {
        const records = getRecords();
        if (records.length === 0) { alert("無成績記錄可匯出"); return; }
        const data = records.map(r => ({
            "時間戳": r.timestamp,
            "姓名": r.name,
            "學號": r.studentId,
            "班級": r.className,
            "選擇題得分": r.choiceScore,
            "簡答題得分": r.essayScore,
            "總分": r.total,
            "學習等級": r.grade
        }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "成績記錄");
        XLSX.writeFile(wb, `考試成績_${new Date().toISOString().slice(0,19)}.xlsx`);
    }

    // ---------- 考試核心 ----------
    function initExam() {
        currentChoice = getRandomItems(CHOICE_QUESTION_POOL, CHOICE_COUNT);
        currentEssay = getRandomItems(ESSAY_QUESTION_POOL, ESSAY_COUNT);
        userChoice = new Array(CHOICE_COUNT).fill(null);
        userEssay = new Array(ESSAY_COUNT).fill("");
        renderQuestions();
        if (timerInterval) clearInterval(timerInterval);
        timeSeconds = 60 * 60;
        updateTimerDisplay();
        startTimer();
        document.getElementById('resultArea').style.display = 'none';
    }

    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';
        // 選擇題
        const choiceTitle = document.createElement('div');
        choiceTitle.className = 'section-title';
        choiceTitle.innerText = '📌 一、選擇題（每題 2 分）';
        container.appendChild(choiceTitle);
        currentChoice.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <div class="q-title">${idx+1}. ${q.text}</div>
                <div class="options" id="options-${idx}">
                    ${q.options.map((opt, optIdx) => `
                        <div class="option" data-choice="${idx}" data-opt="${optIdx}" onclick="selectChoice(${idx},${optIdx},this)">
                            <input type="radio" name="c${idx}" style="display:none">
                            ${String.fromCharCode(65+optIdx)}. ${opt}
                        </div>
                    `).join('')}
                </div>
            `;
            container.appendChild(card);
            if (userChoice[idx] !== null) {
                const selectedDiv = card.querySelector(`.option[data-opt="${userChoice[idx]}"]`);
                if (selectedDiv) selectedDiv.classList.add('selected');
            }
        });
        // 簡答題
        const essayTitle = document.createElement('div');
        essayTitle.className = 'section-title';
        essayTitle.innerText = '✍️ 二、簡答題（每題 10 分）';
        container.appendChild(essayTitle);
        currentEssay.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <div class="q-title">${idx+1}. ${q.text}</div>
                <textarea class="essay-answer" data-essay="${idx}" rows="4" placeholder="請在此作答..."></textarea>
            `;
            container.appendChild(card);
            const ta = card.querySelector('textarea');
            ta.addEventListener('input', (e) => { userEssay[idx] = e.target.value; });
            if (userEssay[idx]) ta.value = userEssay[idx];
        });
    }

    window.selectChoice = function(qIdx, optIdx, element) {
        userChoice[qIdx] = optIdx;
        const parent = element.parentElement;
        Array.from(parent.children).forEach(child => child.classList.remove('selected'));
        element.classList.add('selected');
    };

    function updateTimerDisplay() {
        const minutes = Math.floor(timeSeconds / 60);
        const secs = timeSeconds % 60;
        document.getElementById('timer').innerText = `${minutes.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (timeSeconds <= 0) {
                clearInterval(timerInterval);
                alert("時間到！系統將自動提交試卷。");
                submitExam();
            } else {
                timeSeconds--;
                updateTimerDisplay();
            }
        }, 1000);
    }

    function computeResult() {
        let choiceScore = 0;
        let choiceMistakes = [];
        for (let i = 0; i < currentChoice.length; i++) {
            const user = userChoice[i];
            const correct = currentChoice[i].correct;
            if (user === correct) {
                choiceScore += 2;
            } else {
                choiceMistakes.push({
                    num: i+1,
                    text: currentChoice[i].text,
                    userAnswer: user !== null ? String.fromCharCode(65+user) : "未作答",
                    correctAnswer: String.fromCharCode(65+correct),
                    correctText: currentChoice[i].options[correct]
                });
            }
        }
        let essayScore = 0;
        let essayDetails = [];
        for (let i = 0; i < currentEssay.length; i++) {
            const answer = userEssay[i];
            const keywords = currentEssay[i].keywords;
            const score = scoreByKeywords(answer, keywords, 10);
            essayScore += score;
            essayDetails.push({
                num: i+1,
                text: currentEssay[i].text,
                answer: answer || "未作答",
                score: score
            });
        }
        const total = choiceScore + essayScore;
        const grade = total >= 81 ? "A (優異)" : total >= 72 ? "B (良好)" : total >= 63 ? "C (中等)" : total >= 54 ? "D (及格)" : "F (不及格)";
        return { choiceScore, essayScore, total, grade, choiceMistakes, essayDetails };
    }

    async function submitExam() {
        if (timerInterval) clearInterval(timerInterval);
        const name = document.getElementById('studentName').value.trim();
        const studentId = document.getElementById('studentId').value.trim();
        if (!name || !studentId) { alert("請填寫姓名與學號"); return; }
        const className = document.getElementById('studentClass').value.trim();
        const result = computeResult();

        // 顯示結果
        document.getElementById('totalScore').innerText = result.total;
        document.getElementById('gradeLetter').innerHTML = `學習等級：${result.grade}`;
        let html = `<strong>✅ 選擇題得分：${result.choiceScore} / 60</strong><br><strong>📝 簡答題得分：${result.essayScore} / 30</strong><br><br>`;
        if (result.choiceMistakes.length === 0) html += `<p>🎉 選擇題全對！</p>`;
        else {
            html += `<p><strong>❌ 選擇題錯題解析</strong></p>`;
            result.choiceMistakes.forEach(m => {
                html += `<div class="mistake-item" style="border-bottom:1px solid #f0dba0; padding:8px 0;">${m.num}. 您的答案：${m.userAnswer}，正確答案：${m.correctAnswer} (${m.correctText})</div>`;
            });
        }
        html += `<br><p><strong>📋 簡答題評分細節</strong></p>`;
        result.essayDetails.forEach(d => {
            html += `<div style="border-bottom:1px solid #f0dba0; padding:8px 0;">${d.num}. 得分：${d.score}/10<br>您的回答：${d.answer}</div>`;
        });
        document.getElementById('mistakeList').innerHTML = html;
        document.getElementById('resultArea').style.display = 'block';

        // 儲存記錄
        const record = {
            timestamp: new Date().toLocaleString('zh-TW'),
            name, studentId, className,
            choiceScore: result.choiceScore,
            essayScore: result.essayScore,
            total: result.total,
            grade: result.grade
        };
        saveRecord(record);
    }

    function resetExam() {
        if (confirm("重新測驗將清除目前作答並重新抽題，確定嗎？")) {
            initExam();
        }
    }

    document.getElementById('submitBtn').addEventListener('click', submitExam);
    document.getElementById('resetBtn').addEventListener('click', resetExam);
    document.getElementById('clearHistoryBtn').addEventListener('click', clearHistory);
    document.getElementById('exportAllBtn').addEventListener('click', exportAllToExcel);

    initExam();
    renderHistory();
</script>
</body>
</html>

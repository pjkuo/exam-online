const CHOICE_COUNT = 30;
const ESSAY_COUNT = 3;

let currentChoice = [];
let currentEssay = [];
let userChoice = [];
let userEssay = [];
let timerInterval;

function getRandomItems(arr, n) {
  const shuffled = [...arr];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled.slice(0, n);
}

function initExam() {
  currentChoice = getRandomItems(CHOICE_QUESTION_POOL, CHOICE_COUNT);
  currentEssay = getRandomItems(ESSAY_QUESTION_POOL, ESSAY_COUNT);
  userChoice = new Array(CHOICE_COUNT).fill(null);
  userEssay = new Array(ESSAY_COUNT).fill("");
  renderQuestions();
  startTimer();
}

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = `
    <div class="section-title">📌 一、選擇題（每題 2 分）</div>
    ${currentChoice.map((q, i) => `
      <div class="question-card">
        <div class="q-title">${i+1}. ${q.text}</div>
        <div class="options">
          ${q.options.map((opt, j) => `
            <div class="option" onclick="selectChoice(${i},${j},this)">
              <input type="radio" name="c${i}" ${userChoice[i]===j?'checked':''}>
              ${String.fromCharCode(65+j)}. ${opt}
            </div>
          `).join('')}
        </div>
      </div>`).join('')}
    <div class="section-title">✍️ 二、簡答題（每題 10 分）</div>
    ${currentEssay.map((q, i) => `
      <div class="question-card">
        <div class="q-title">${i+1}. ${q.text}</div>
        <textarea class="essay-answer" rows="5" oninput="userEssay[${i}]=this.value" placeholder="請在此作答..."></textarea>
      </div>`).join('')}
  `;
}

function selectChoice(qIdx, optIdx, el) {
  userChoice[qIdx] = optIdx;
  const options = el.parentElement.children;
  Array.from(options).forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
}

function startTimer() {
  let timeLeft = 3600;
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    const min = Math.floor(timeLeft / 60);
    const sec = timeLeft % 60;
    document.getElementById('timer').innerText = `${min}:${sec<10?'0':''}${sec}`;
    if (timeLeft <= 0) submitExam();
  }, 1000);
}

function scoreByKeywords(text, keywords, maxScore = 10) {
  if (!text || text.trim() === "") return 0;
  const lower = text.toLowerCase();
  let hit = 0;
  keywords.forEach(kw => { if (lower.includes(kw.toLowerCase())) hit++; });
  return Math.min(maxScore, Math.round((hit / keywords.length) * maxScore));
}

function computeScoreAndMistakes() {
  let choiceScore = 0;
  let choiceMistakes = [];
  currentChoice.forEach((q, i) => {
    if (userChoice[i] === q.correct) choiceScore += 2;
    else choiceMistakes.push({num:i+1, text:q.text, user:userChoice[i]!==null?String.fromCharCode(65+userChoice[i]):"未作答", correct:String.fromCharCode(65+q.correct), correctText:q.options[q.correct]});
  });
  let essayScore = 0;
  let essayDetails = [];
  currentEssay.forEach((q, i) => {
    const score = scoreByKeywords(userEssay[i], q.keywords, 10);
    essayScore += score;
    essayDetails.push({num:i+1, text:q.text, answer:userEssay[i]||"未作答", score});
  });
  const total = choiceScore + essayScore;
  const grade = total >= 81 ? "A (優異)" : total >= 72 ? "B (良好)" : total >= 63 ? "C (中等)" : total >= 54 ? "D (及格)" : "F (不及格)";
  return {choiceScore, essayScore, total, grade, choiceMistakes, essayDetails};
}

function submitExam() {
  clearInterval(timerInterval);
  const name = document.getElementById('studentName').value.trim();
  const studentId = document.getElementById('studentId').value.trim();
  if (!name || !studentId) { alert("請填寫姓名與學號"); return; }

  const result = computeScoreAndMistakes();

  document.getElementById('scoreText').innerText = result.total;
  document.getElementById('gradeText').innerHTML = `總分 <strong>${result.total}</strong> 分　等第 <strong>${result.grade}</strong>`;

  let detailHTML = `<h3>📋 詳細成績回應</h3>`;
  result.choiceMistakes.forEach(m => {
    detailHTML += `<div style="margin:15px 0;padding:18px;background:#fff5f5;border-radius:16px;border-left:6px solid #e74c3c;"><strong>第${m.num}題 ❌ 錯誤</strong><br>${m.text}<br>您的答案：${m.user}　|　正確答案：${m.correct} (${m.correctText})</div>`;
  });
  result.essayDetails.forEach(d => {
    detailHTML += `<div style="margin:15px 0;padding:18px;background:#f0f8ff;border-radius:16px;"><strong>第${d.num}題 簡答</strong><br>${d.text}<br>您的回答：${d.answer}<br>得分：${d.score}/10</div>`;
  });
  document.getElementById('resultDetail').innerHTML = detailHTML;

  document.getElementById('examPage').style.display = 'none';
  document.getElementById('resultPage').style.display = 'block';

  // 記錄學生成績（localStorage）
  let history = JSON.parse(localStorage.getItem('examHistory') || '[]');
  history.push({
    timestamp: new Date().toLocaleString('zh-TW'),
    name: name,
    studentId: studentId,
    className: document.getElementById('studentClass').value.trim() || "未填",
    total: result.total,
    grade: result.grade,
    choiceScore: result.choiceScore,
    essayScore: result.essayScore
  });
  localStorage.setItem('examHistory', JSON.stringify(history));
}

function exportToExcel() {
  const history = JSON.parse(localStorage.getItem('examHistory') || '[]');
  if (history.length === 0) {
    alert("目前沒有任何成績記錄");
    return;
  }
  const ws = XLSX.utils.json_to_sheet(history);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "成績記錄");
  XLSX.writeFile(wb, `期中考成績_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function restartExam() {
  location.reload();
}

window.onload = initExam;
</script>

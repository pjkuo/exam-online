    // ==================== 教師密碼雜湊（SHA-256）====================
    let CORRECT_HASH = "";

    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function initPasswordHash() {
        CORRECT_HASH = await sha256("1728");
    }

    let isLoggedIn = false;
    async function teacherLogin() {
        const pwd = document.getElementById('teacherPwd').value;
        if (!pwd) { alert("請輸入密碼"); return; }
        const inputHash = await sha256(pwd);
        if (inputHash === CORRECT_HASH) {
            isLoggedIn = true;
            document.getElementById('teacherArea').classList.add('show');
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'inline-block';
            document.getElementById('teacherPwd').value = '';
            renderHistory();
        } else {
            alert("密碼錯誤，無法查看成績摘要。");
        }
    }

        isLoggedIn = false;

    const AXIS_NAME = { A: "感知與資料", B: "監控與自動控制", C: "智慧與AI", D: "網路通訊與架構", E: "應用與產業", F: "人機協作 HITL／HOTL／HOOTL" };
    const QUOTA = { A: 4, B: 5, C: 5, D: 6, E: 4, F: 6 };   // 每卷 30 題
    const CHOICE_COUNT = Object.values(QUOTA).reduce((a, b) => a + b, 0);
    const LAST_PAPER_KEY = "examOnline.lastPaper.v2";

    const normStem = s => String(s).replace(/[「」『』（）()？?：:。，,、\s]/g, "");

    // 載入時再防呆一次：同 id 或同題幹（正規化後）只留第一筆
    const BANK = (() => {
        const ids = new Set(), stems = new Set(), out = [];
        BANK_RAW.forEach(q => {
            const k = normStem(q.t);
            if (ids.has(q.id) || stems.has(k)) { console.warn("[exam] 題庫重複已略過：", q.id, q.t); return; }
            ids.add(q.id); stems.add(k); out.push(q);
        });
        return out;
    })();

    // ---------- 隨機（crypto 亂數＋Fisher–Yates）----------
    function randInt(n) {
        if (window.crypto && crypto.getRandomValues) {
            const max = Math.floor(0x100000000 / n) * n, buf = new Uint32Array(1);
            let x;
            do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= max);
            return x % n;
        }
        return Math.floor(Math.random() * n);
    }
    function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
        return a;
    }

    function readLastPaper() { try { return JSON.parse(localStorage.getItem(LAST_PAPER_KEY) || "[]"); } catch (e) { return []; } }
    function writeLastPaper(ids) { try { localStorage.setItem(LAST_PAPER_KEY, JSON.stringify(ids)); } catch (e) {} }

    // 試卷檢核：題數、各主軸題數、題號不重複、題幹不重複、概念群組不重複
    function validatePaper(paper) {
        const errs = [];
        if (paper.length !== CHOICE_COUNT) errs.push("題數 " + paper.length);
        const ids = new Set(), stems = new Set(), groups = new Set(), axis = {};
        paper.forEach(q => {
            if (ids.has(q.id)) errs.push("重複題號 " + q.id); ids.add(q.id);
            const k = normStem(q.t || q.text);
            if (stems.has(k)) errs.push("重複題幹 " + q.id); stems.add(k);
            (q.g || []).forEach(g => { if (groups.has(g)) errs.push("同概念群組 " + g); groups.add(g); });
            axis[q.a] = (axis[q.a] || 0) + 1;
        });
        Object.keys(QUOTA).forEach(a => { if ((axis[a] || 0) !== QUOTA[a]) errs.push("主軸 " + a + " 題數 " + (axis[a] || 0)); });
        return errs;
    }

    // 選項打亂；「以上皆是／以上皆非」固定在最後
    function prepareQuestion(q) {
        const items = q.o.map((text, i) => ({ text, correct: i === q.c }));
        const pinned = items.filter(x => /^以上(皆是|皆非)$/.test(x.text));
        const free = shuffle(items.filter(x => !pinned.includes(x)));
        const opts = free.concat(pinned);
        return { id: q.id, a: q.a, g: q.g, text: q.t, options: opts.map(x => x.text), correct: opts.findIndex(x => x.correct) };
    }

    // 分層抽題：各主軸依配額抽，同卷不重複；「重新抽題」優先避開上一卷題目
    function drawPaper() {
        const last = readLastPaper();
        for (let attempt = 0; attempt < 400; attempt++) {
            const avoid = attempt < 200 ? new Set(last) : new Set();
            const usedG = new Set(), usedS = new Set(), picked = [];
            let ok = true;
            for (const ax of shuffle(Object.keys(QUOTA))) {
                let got = 0;
                for (const q of shuffle(BANK.filter(x => x.a === ax && !avoid.has(x.id)))) {
                    if (got === QUOTA[ax]) break;
                    if ((q.g || []).some(g => usedG.has(g)) || usedS.has(normStem(q.t))) continue;
                    picked.push(q); got++;
                    (q.g || []).forEach(g => usedG.add(g)); usedS.add(normStem(q.t));
                }
                if (got < QUOTA[ax]) { ok = false; break; }
            }
            if (ok && validatePaper(picked).length === 0) return shuffle(picked).map(prepareQuestion);
        }
        throw new Error("抽題失敗：題庫不足以滿足配額");
    }

    function paperCode(paper) {
        let h = 5381;
        paper.map(q => q.id).sort().join(",").split("").forEach(ch => { h = ((h << 5) + h + ch.charCodeAt(0)) >>> 0; });
        return h.toString(36).toUpperCase().padStart(6, "0").slice(-6);
    }

    let currentChoice = [];
    let userChoice = [];
    let timerInterval = null;
    let timeSeconds = 60 * 60;

    // ---------- 成績儲存與讀取 ----------
    const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbykaId-phLVwEjKt3eW1xtVXWhUFbxQb25s6iEGXiQ93dVm9jHzEzEU2PP7rTP89Xpw/exec";

    async function saveRecord(record) {
        let records = JSON.parse(localStorage.getItem('examScores') || '[]');
        records.unshift(record);
        if (records.length > 100) records = records.slice(0, 100);
        localStorage.setItem('examScores', JSON.stringify(records));
        try {
            await fetch(GOOGLE_SHEETS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(record)
            });
            console.log("成績已提交至 Google 試算表");
        } catch (err) {
            console.error("提交至 Google Sheets 失敗", err);
        }
        if (isLoggedIn) renderHistory();
    }

    function getRecords() {
        return JSON.parse(localStorage.getItem('examScores') || '[]');
    }

    function clearHistory() {
        if (confirm("清除所有歷史成績記錄？")) {
            localStorage.removeItem('examScores');
            if (isLoggedIn) renderHistory();
        }
    }

    function exportAllToExcel() {
        const records = getRecords();
        if (records.length === 0) { alert("無成績記錄可匯出"); return; }
        const data = records.map(r => ({
            "時間戳": r.timestamp,
            "姓名": r.name,
            "學號": r.studentId,
            "班級": r.className,
            "選擇題得分": r.choiceScore,
            "簡答題得分": r.essayScore,
            "總分": r.total,
            "學習等級": r.grade
        }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "成績記錄");
        XLSX.writeFile(wb, `考試成績_${new Date().toISOString().slice(0,19)}.xlsx`);
    }

    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function renderHistory() {
        const records = getRecords();
        const tbody = document.getElementById('historyBody');
        if (records.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8">尚無任何成績記錄</td></tr>';
            document.getElementById('historyStats').innerHTML = '';
            return;
        }
        tbody.innerHTML = records.map(r => `<tr>
                        <td>${esc(r.timestamp)}</td>
                        <td>${esc(r.name)}</td>
                        <td>${esc(r.studentId)}</td>
                        <td>${esc(r.className || '')}</td>
                        <td>${esc(r.choiceScore)}</td>
                        <td>${esc(r.essayScore)}</td>
                        <td>${esc(r.total)}</td>
                        <td>${esc(r.grade)}</td>
                     </tr>`).join('');
        const totals = records.map(r => r.total);
        const avg = (totals.reduce((a,b)=>a+b,0)/totals.length).toFixed(1);
        const pass = totals.filter(s => s >= 60).length;
        document.getElementById('historyStats').innerHTML = `
            <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 15px;">
                <div><strong>總考試次數：</strong> ${records.length}</div>
                <div><strong>平均分數：</strong> ${avg}</div>
                <div><strong>最高分：</strong> ${Math.max(...totals)}</div>
                <div><strong>最低分：</strong> ${Math.min(...totals)}</div>
                <div><strong>及格率：</strong> ${((pass/totals.length)*100).toFixed(1)}%</div>
            </div>`;
    }

    // ---------- 考試核心 ----------
    function initExam() {
        currentChoice = drawPaper();
        writeLastPaper(currentChoice.map(q => q.id));
        userChoice = new Array(CHOICE_COUNT).fill(null);
        renderQuestions();
        if (timerInterval) clearInterval(timerInterval);
        timeSeconds = 60 * 60;
        updateTimerDisplay();
        startTimer();
        document.getElementById('resultArea').style.display = 'none';
    }

    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';
        const info = document.createElement('div');
        info.className = 'paper-info';
        info.innerHTML = `本卷 ${CHOICE_COUNT} 題，自 ${BANK.length} 題題庫分層隨機抽出：` +
            Object.keys(QUOTA).map(a => `${AXIS_NAME[a]} ${QUOTA[a]}`).join('｜') +
            `。同卷題目不重複、近似題不同時出現，選項順序隨機。試卷碼 <code>${paperCode(currentChoice)}</code>`;
        container.appendChild(info);
        const choiceTitle = document.createElement('div');
        choiceTitle.className = 'section-title';
        choiceTitle.innerText = '📌 選擇題（每題 2 分）';
        container.appendChild(choiceTitle);
        currentChoice.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.dataset.qid = q.id;
            card.innerHTML = `
                <div class="q-title">${idx+1}. ${esc(q.text)}<span class="ax-chip ${q.a}">${esc(AXIS_NAME[q.a].split(' ')[0])}</span></div>
                <div class="options" id="options-${idx}">
                    ${q.options.map((opt, optIdx) => `
                        <div class="option" data-choice="${idx}" data-opt="${optIdx}" onclick="selectChoice(${idx},${optIdx},this)">
                            <input type="radio" name="c${idx}" style="display:none">
                            ${String.fromCharCode(65+optIdx)}. ${esc(opt)}
                        </div>
                    `).join('')}
                </div>`;
            container.appendChild(card);
            if (userChoice[idx] !== null) {
                const selectedDiv = card.querySelector(`.option[data-opt="${userChoice[idx]}"]`);
                if (selectedDiv) selectedDiv.classList.add('selected');
            }
        });
    }

    window.selectChoice = function(qIdx, optIdx, element) {
        userChoice[qIdx] = optIdx;
        Array.from(element.parentElement.children).forEach(child => child.classList.remove('selected'));
        element.classList.add('selected');
    };

    function updateTimerDisplay() {
        const minutes = Math.floor(timeSeconds / 60);
        const secs = timeSeconds % 60;
        document.getElementById('timer').innerText = `${minutes.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (timeSeconds <= 0) {
                clearInterval(timerInterval);
                alert("時間到！系統將自動提交試卷。");
                submitExam();
            } else {
                timeSeconds--;
                updateTimerDisplay();
            }
        }, 1000);
    }

    function computeResult() {
        let choiceScore = 0;
        const choiceMistakes = [];
        currentChoice.forEach((q, i) => {
            const user = userChoice[i];
            if (user === q.correct) choiceScore += 2;
            else choiceMistakes.push({
                num: i + 1,
                text: q.text,
                userAnswer: user !== null ? String.fromCharCode(65 + user) : "未作答",
                correctAnswer: String.fromCharCode(65 + q.correct),
                correctText: q.options[q.correct]
            });
        });
        // 總分只計選擇題（比重 100%）：選擇題得分 × CHOICE_MULTIPLIER
        const CHOICE_MULTIPLIER = 1.6;
        const total = Math.round(choiceScore * CHOICE_MULTIPLIER * 10) / 10;
        const grade = total >= 90 ? "A (優異)" : total >= 80 ? "B (良好)" : total >= 70 ? "C (中等)" : total >= 60 ? "D (及格)" : "F (不及格)";
        return { choiceScore, total, grade, choiceMistakes };
    }

    function submitExam() {
        if (timerInterval) clearInterval(timerInterval);
        const name = document.getElementById('studentName').value.trim();
        const studentId = document.getElementById('studentId').value.trim();
        if (!name || !studentId) { alert("請填寫姓名與學號"); return; }
        const className = document.getElementById('studentClass').value.trim();
        const result = computeResult();

        document.getElementById('totalScore').innerText = result.total;
        document.getElementById('gradeLetter').innerHTML = `學習等級：${result.grade}`;
        let html = `<strong>✅ 選擇題得分：${result.choiceScore} / ${CHOICE_COUNT * 2}（總分 = 選擇題 × 1.6）</strong><br><br>`;
        if (result.choiceMistakes.length === 0) html += `<p>🎉 選擇題全對！</p>`;
        else {
            html += `<p><strong>❌ 選擇題錯題解析</strong></p>`;
            result.choiceMistakes.forEach(m => {
                html += `<div class="mistake-item">${m.num}. ${esc(m.text)}<br>您的答案：${m.userAnswer}，正確答案：${m.correctAnswer}（${esc(m.correctText)}）</div>`;
            });
        }
        document.getElementById('mistakeList').innerHTML = html;
        document.getElementById('resultArea').style.display = 'block';

        saveRecord({
            timestamp: new Date().toLocaleString('zh-TW'),
            name, studentId, className,
            choiceScore: result.choiceScore,
            essayScore: 0,   // 已取消簡答題，保留欄位讓試算表格式不變
            total: result.total,
            grade: result.grade
        });
    }

    function resetExam() {
        if (confirm("重新測驗將清除目前作答並重新抽題（會避開上一卷的題目），確定嗎？")) {
            initExam();
        }
    }

    document.getElementById('submitBtn').addEventListener('click', submitExam);
    document.getElementById('resetBtn').addEventListener('click', resetExam);
    document.getElementById('loginBtn').addEventListener('click', teacherLogin);
    document.getElementById('logoutBtn').addEventListener('click', teacherLogout);
    document.getElementById('clearHistoryBtn').addEventListener('click', clearHistory);
    document.getElementById('exportAllBtn').addEventListener('click', exportAllToExcel);

    (function () {
        const nF = BANK.filter(q => q.a === 'F').length;
        document.getElementById('examSubtitle').textContent =
            `物聯網與智慧人機協作｜題庫 ${BANK.length} 題（含 HITL／HOTL／HOOTL 人機協作 ${nF} 題）｜分層隨機抽 ${CHOICE_COUNT} 題・同卷不重複｜成績自動保存`;
    })();

    // 測試／稽核用
    window.__examOnline = { version: "v2-2026-10-29", BANK, QUOTA, drawPaper, validatePaper, prepareQuestion, paperCode, current: () => currentChoice };

    (async () => {
        await initPasswordHash();
        initExam();
